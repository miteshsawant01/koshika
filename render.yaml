services:
  - type: web
    name: stembridge-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: "https://hytzgimcitwdvsdzgjxz.supabase.co"
      - key: SUPABASE_KEY
        value: "sb_publishable_m0s-xmDsN3rKnYRdt8Z3Ag_hzf15P8O"
      - key: GEMINI_API_KEY
        sync: false
